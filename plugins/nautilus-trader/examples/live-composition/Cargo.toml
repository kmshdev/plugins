[package]
name = "nautilus-skill-live-composition"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
nautilus-common = { version = "=0.63.0", default-features = false }
nautilus-core = { version = "=0.63.0", default-features = false }
nautilus-databento = { version = "=0.63.0", default-features = false, features = ["live", "high-precision"] }
nautilus-interactive-brokers = { version = "=0.63.0", default-features = false, features = ["execution"] }
nautilus-live = { version = "=0.63.0", default-features = false, features = ["node"] }
nautilus-model = { version = "=0.63.0", default-features = false, features = ["high-precision"] }
